<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Building Code Companion</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f5f0;color:#1d1f22;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
  @media (prefers-color-scheme: dark){body{background:#121417;color:#ebe8e2}a{color:#7ab6df}}
  main{max-width:440px;text-align:center}
  h1{font:600 1.6rem Georgia,serif;margin:0 0 .4em}
  a{color:#1e5b86}
</style>
</head>
<body>
<main>
  <h1>That page isn't here</h1>
  <p>The link may be old. Taking you to the <a id="home" href="/">Building Code Companion home page</a> in a moment.</p>
</main>
<script>
  // On a GitHub project site the home page lives at /<repository>/, so send visitors there.
  var seg = location.pathname.split("/")[1];
  var home = (location.hostname.endsWith("github.io") && seg) ? "/" + seg + "/" : "/";
  document.getElementById("home").href = home;
  setTimeout(function(){ location.replace(home); }, 3000);
</script>
</body>
</html>
